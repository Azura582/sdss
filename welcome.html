<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>零碳智净</title>
  <style>
    :root {
      --ink: #062235;
      --muted: #3a677e;
      --line: rgba(6, 34, 53, 0.14);
      --card: rgba(255, 255, 255, 0.9);
      --bg-a: #d8f3ff;
      --bg-b: #f4fbff;
      --btn: #0f5f8f;
      --btn-hover: #0b4d74;
      --radius: 16px;
      --shadow: 0 12px 30px rgba(8, 56, 82, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: radial-gradient(circle at 15% 10%, var(--bg-a), var(--bg-b) 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 动态波纹背景 canvas */
    .sea-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 44px;
    }

    /* ── 标题区 ── */
    .hero {
      text-align: center;
      animation: fadeDown 0.7s ease both;
    }

    .hero-eyebrow {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 16px;
      font-size: 12px;
      background: rgba(255,255,255,0.85);
      color: var(--muted);
      margin-bottom: 20px;
      letter-spacing: 1.5px;
    }

    .hero h1 {
      font-size: clamp(52px, 11vw, 84px);
      font-weight: 800;
      letter-spacing: 6px;
      line-height: 1.08;
      background: linear-gradient(140deg, #062b45 0%, #1275b8 50%, #3ab8e8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .hero .en {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 3px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .hero .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.8;
      max-width: 460px;
      margin: 0 auto;
    }

    /* ── 两个导航卡片 ── */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 580px;
      animation: fadeUp 0.75s 0.15s ease both;
    }

    @media (max-width: 500px) {
      .btn-group { grid-template-columns: 1fr; }
    }

    .nav-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      padding: 30px 22px 26px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .nav-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 22px 48px rgba(8, 56, 82, 0.22);
    }

    .nav-card .icon {
      font-size: 46px;
      line-height: 1;
    }

    .nav-card .nav-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 2px;
    }

    .nav-card .nav-sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .nav-card .nav-btn {
      margin-top: 10px;
      display: inline-block;
      background: var(--btn);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 26px;
      cursor: pointer;
      transition: background 0.15s ease;
      text-decoration: none;
    }

    .nav-card .nav-btn:hover { background: var(--btn-hover); }

    /* 次要卡片按钮用描边风格 */
    .nav-card.alt .nav-btn {
      background: transparent;
      color: var(--btn);
      border: 1.5px solid rgba(15,95,143,0.35);
    }

    .nav-card.alt .nav-btn:hover {
      background: rgba(15,95,143,0.08);
    }

    /* ── 底部 ── */
    .footer {
      font-size: 12px;
      color: var(--muted);
      opacity: 0.75;
      animation: fadeUp 0.8s 0.3s ease both;
      letter-spacing: 0.5px;
    }

    /* ── 关键帧 ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 动态海洋背景 -->
  <canvas class="sea-canvas" id="bg"></canvas>

  <div class="wrap">

    <div class="hero">
      <div class="hero-eyebrow">Zero-Carbon Intelligent Marine Cleaning System</div>
      <h1>零碳智净</h1>
      <p class="en">Smart Sea · Clean Future</p>
      <p class="desc">水-空协同无人系统平台，实现水藻检测与清洁作业</p>
    </div>

    <div class="btn-group">

      <a href="/sim" class="nav-card">
        <div class="icon"></div>
        <div class="nav-title">协同仿真面板</div>
        <div class="nav-sub">
          无人船 × 无人机<br>
          CIN / P2P 调度对比
        </div>
        <span class="nav-btn">进入仿真</span>
      </a>

      <a href="/detect" class="nav-card alt">
        <div class="icon"></div>
        <div class="nav-title">水藻智能检测</div>
        <div class="nav-sub">
          YOLOv8 深度识别<br>
          批量处理 · 路径规划
        </div>
        <span class="nav-btn">开始检测</span>
      </a>

    </div>

    <div class="footer">
      零碳智净 v1.0 &nbsp;·&nbsp; 2026 &nbsp;·&nbsp; Smart Ocean Cleaning Platform
    </div>

  </div>

  <script>
  (() => {
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    function draw(now) {
      const t = now * 0.001;
      ctx.clearRect(0, 0, W, H);

      // 渐变底色
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0,   "rgba(169,227,255,0.22)");
      g.addColorStop(0.5, "rgba(97,191,232,0.10)");
      g.addColorStop(1,   "rgba(45,146,196,0.06)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // 8 层波纹线
      for (let i = 0; i < 8; i++) {
        const y = H * 0.28 + (i / 7) * H * 0.68;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 18) {
          const wy = Math.sin(x * 0.013 + t * 1.15 + i * 0.65) * (5 + i * 0.55);
          x === 0 ? ctx.moveTo(x, y + wy) : ctx.lineTo(x, y + wy);
        }
        ctx.strokeStyle = `rgba(255,255,255,${0.06 + i * 0.007})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // 漂浮泡沫
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      for (let i = 0; i < 20; i++) {
        const x = (i * 103 + t * 36) % (W + 40) - 20;
        const y = H * 0.32 + Math.sin((i * 1.3 + t) * 0.8) * (H * 0.26);
        ctx.beginPath();
        ctx.arc(x, y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  })();
  </script>

</body>
</html>
