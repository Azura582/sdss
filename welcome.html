<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>零碳智净</title>
  <style>
    :root {
      --ink: #062235;
      --muted: #3a677e;
      --line: rgba(6, 34, 53, 0.14);
      --card: rgba(255, 255, 255, 0.9);
      --bg-a: #d8f3ff;
      --bg-b: #f4fbff;
      --btn: #0f5f8f;
      --btn-hover: #0b4d74;
      --radius: 16px;
      --shadow: 0 12px 30px rgba(8, 56, 82, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: radial-gradient(circle at 15% 10%, var(--bg-a), var(--bg-b) 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 动态波纹背景 canvas */
    .sea-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 44px;
    }

    /* ── 标题区 ── */
    .hero {
      text-align: center;
      animation: fadeDown 0.7s ease both;
    }

    .hero-eyebrow {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 16px;
      font-size: 12px;
      background: rgba(255,255,255,0.85);
      color: var(--muted);
      margin-bottom: 20px;
      letter-spacing: 1.5px;
    }

    .hero h1 {
      font-size: clamp(52px, 11vw, 84px);
      font-weight: 800;
      letter-spacing: 6px;
      line-height: 1.08;
      background: linear-gradient(140deg, #062b45 0%, #1275b8 50%, #3ab8e8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .hero .en {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 3px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .hero .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.8;
      max-width: 460px;
      margin: 0 auto;
    }

    /* ── 两个导航卡片 ── */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 580px;
      animation: fadeUp 0.75s 0.15s ease both;
    }

    @media (max-width: 500px) {
      .btn-group { grid-template-columns: 1fr; }
    }

    .nav-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      padding: 30px 22px 26px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .nav-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 22px 48px rgba(8, 56, 82, 0.22);
    }

    .nav-card .icon {
      font-size: 46px;
      line-height: 1;
    }

    .nav-card .nav-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 2px;
    }

    .nav-card .nav-sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .nav-card .nav-btn {
      margin-top: 10px;
      display: inline-block;
      background: var(--btn);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 26px;
      cursor: pointer;
      transition: background 0.15s ease;
      text-decoration: none;
    }

    .nav-card .nav-btn:hover { background: var(--btn-hover); }

    /* 次要卡片按钮用描边风格 */
    .nav-card.alt .nav-btn {
      background: transparent;
      color: var(--btn);
      border: 1.5px solid rgba(15,95,143,0.35);
    }

    .nav-card.alt .nav-btn:hover {
      background: rgba(15,95,143,0.08);
    }

    /* ── 底部 ── */
    .footer {
      font-size: 12px;
      color: var(--muted);
      opacity: 0.75;
      animation: fadeUp 0.8s 0.3s ease both;
      letter-spacing: 0.5px;
    }

    /* ── 关键帧 ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 动态海洋背景 -->
  <canvas class="sea-canvas" id="bg"></canvas>

  <div class="wrap">

    <div class="hero">
      <div class="hero-eyebrow">Zero-Carbon Intelligent Marine Cleaning System</div>
      <h1>零碳智净</h1>
      <p class="en">Smart Sea · Clean Future</p>
      <p class="desc">水-空协同无人系统平台，实现水藻检测与清洁作业</p>
    </div>

    <div class="btn-group">

      <a href="/sim" class="nav-card">
        
        <div class="nav-title">协同仿真面板</div>
        <div class="nav-sub">
          无人船 × 无人机<br>
          CIN / P2P 调度对比
        </div>
        <span class="nav-btn">进入仿真</span>
      </a>

      <a href="/detect" class="nav-card alt">
        
        <div class="nav-title">水藻智能检测</div>
        <div class="nav-sub">
          YOLOv8 深度识别<br>
          批量处理 · 路径规划
        </div>
        <span class="nav-btn">开始检测</span>
      </a>

    </div>

    <div class="footer">
      零碳智净 v1.0 &nbsp;·&nbsp; 2026 &nbsp;·&nbsp; Smart Ocean Cleaning Platform
    </div>

  </div>

  <script>
  (() => {
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // 每条波浪的独立参数
    const WAVES = [
      { amp: 38, freq: 0.008, speed: 0.55, yRatio: 0.55, color: "rgba(14,110,168,0.18)",  lw: 2.5 },
      { amp: 28, freq: 0.011, speed: 0.80, yRatio: 0.62, color: "rgba(30,140,200,0.15)",  lw: 2.0 },
      { amp: 48, freq: 0.006, speed: 0.40, yRatio: 0.70, color: "rgba(10, 90,145,0.20)",  lw: 3.0 },
      { amp: 22, freq: 0.014, speed: 1.10, yRatio: 0.74, color: "rgba(50,170,220,0.12)",  lw: 1.5 },
      { amp: 55, freq: 0.005, speed: 0.30, yRatio: 0.82, color: "rgba(8,  72,130,0.22)",  lw: 3.5 },
      { amp: 18, freq: 0.018, speed: 1.40, yRatio: 0.87, color: "rgba(70,190,235,0.10)",  lw: 1.5 },
      { amp: 32, freq: 0.009, speed: 0.65, yRatio: 0.93, color: "rgba(20,120,175,0.16)",  lw: 2.0 },
    ];

    // 泡沫粒子池
    const BUBBLES = Array.from({ length: 28 }, (_, i) => ({
      seed: i * 137.5,
      speed: 22 + Math.random() * 30,
      yBase: 0.35 + Math.random() * 0.45,
      yAmp:  0.04 + Math.random() * 0.10,
      r:     1.4  + Math.random() * 2.2,
      phase: Math.random() * Math.PI * 2,
    }));

    function drawWaveFill(wave, t) {
      const baseY = H * wave.yRatio;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 6) {
        const y = baseY + Math.sin(x * wave.freq + t * wave.speed) * wave.amp
                        + Math.sin(x * wave.freq * 1.7 + t * wave.speed * 0.6) * wave.amp * 0.35;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      // 渐变填充
      const grd = ctx.createLinearGradient(0, baseY - wave.amp, 0, H);
      grd.addColorStop(0, wave.color);
      grd.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grd;
      ctx.fill();
    }

    function drawWaveLine(wave, t, offset) {
      const baseY = H * wave.yRatio + offset;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 6) {
        const y = baseY + Math.sin(x * wave.freq + t * wave.speed + 0.8) * wave.amp * 0.6
                        + Math.sin(x * wave.freq * 2.1 + t * wave.speed * 0.8) * wave.amp * 0.2;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = wave.color.replace(/[\d.]+\)$/, "0.55)");
      ctx.lineWidth = wave.lw;
      ctx.stroke();
    }

    function draw(now) {
      const t = now * 0.001;
      ctx.clearRect(0, 0, W, H);

      // 整体海面渐变底色
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0,    "rgba(210,242,255,0.30)");
      bg.addColorStop(0.40, "rgba(120,205,240,0.18)");
      bg.addColorStop(0.75, "rgba(55,155,210,0.14)");
      bg.addColorStop(1,    "rgba(20,100,165,0.10)");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // 先画波浪填充层（从底到顶，深色先画）
      for (let i = WAVES.length - 1; i >= 0; i--) {
        drawWaveFill(WAVES[i], t);
      }

      // 再画波浪描线（高光边缘）
      for (const w of WAVES) {
        drawWaveLine(w, t, -w.amp * 0.5);
      }

      // 泡沫粒子
      for (const b of BUBBLES) {
        const x = (b.seed + t * b.speed) % (W + 40) - 20;
        const y = H * b.yBase + Math.sin(t * 0.9 + b.phase) * H * b.yAmp;
        ctx.beginPath();
        ctx.arc(x, y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.fill();
      }

      // 顶部光晕（模拟阳光反射）
      const glare = ctx.createRadialGradient(W * 0.72, H * 0.18, 0, W * 0.72, H * 0.18, W * 0.38);
      glare.addColorStop(0,   "rgba(255,255,255,0.12)");
      glare.addColorStop(0.5, "rgba(180,230,255,0.05)");
      glare.addColorStop(1,   "rgba(0,0,0,0)");
      ctx.fillStyle = glare;
      ctx.fillRect(0, 0, W, H);

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  })();
  </script>

</body>
</html>
